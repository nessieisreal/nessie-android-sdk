apply plugin: 'com.android.library'
apply plugin: 'maven-publish'
apply plugin: 'org.jetbrains.kotlin.android'

// Version to use when deploying the artifact
version = "1.0.5"

android {
    namespace "com.reimaginebanking.api.nessie"
    compileSdkVersion 23
    buildToolsVersion "23.0.3"
    resourcePrefix "nessie__"

    defaultConfig {
        minSdkVersion 16
        targetSdkVersion 23
        versionCode 1
        versionName version
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

def gitUrl = 'https://github.com/nessieisreal/nessie-android-sdk'   // Git repository URL
group = "com.reimaginebanking.api"

// TODO: Replace this legacy publishing configuration with an updated Maven Publish setup once migration is complete.
